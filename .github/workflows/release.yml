name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # `contents: write` is what creates the Release page. It was `read`, so the workflow published
  # to npm and created no Release: the repo's "Latest" badge sat at v1.0.1 while npm served
  # 1.1.7, and the tag carrying the v1.1.2 data-plane P0 — the one where an upgrade is
  # mandatory — had no page for anyone to find.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Integrity first. This is not ceremony: the run tagged v1.1.0 published **1.1.8**, because
      # package.json had moved on while the tag had not, and npm has no way to know. The result was
      # a version on npm with no corresponding Release, and no error at any point.
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            echo "Publishing would put an unrelated version on npm. Bump package.json or retag."
            exit 1
          fi
          echo "tag and package agree: $TAG_VERSION"
      - run: npm ci --no-audit --no-fund
      # The whole suite, not a hand-listed subset. `npm test` is the single definition; a
      # release must not be able to publish on a subset that the local gate runs in full.
      - name: Unit tests
        run: npm test
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Native declarations match the modules
        run: node scripts/check-native-types.mjs
      - name: Generated Luau source is intact
        run: node scripts/check-luau-source.mjs
      - name: Compatibility matrix (static tier)
        run: node native/compat.mjs --static
      - name: Publish to npm
        # npm trusted publishing (OIDC) must be configured for this repo/workflow.
        # An NPM_TOKEN secret also works (it then takes precedence over OIDC).
        #
        # continue-on-error because npm rejects a re-publish of a version that already exists, and
        # that must not block the Release: a retagged or re-run release should still get its page.
        # The verification step below is what keeps this honest - if a publish genuinely failed,
        # the version will not be on npm and that step fails.
        continue-on-error: true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify the version is on npm
        # npm answers "+ pi-tern@1.1.9" and then says the package "is being processed and may take a
        # few minutes to become available". Querying immediately after returns the old version list,
        # so this polls rather than asking once - a single check failed a genuinely successful
        # publish, which is worse than no check at all.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view pi-tern versions --json 2>/dev/null | tr -d ' "[]' | tr ',' '\n' | grep -qx "$VERSION"; then
              echo "$VERSION is on npm (after $attempt attempt(s))"
              exit 0
            fi
            echo "  not yet on npm; retrying ($attempt/30)"
            sleep 10
          done
          echo "::error::$VERSION is not on npm after 5 minutes - the publish failed for a real reason"
          exit 1
      - name: Create the GitHub Release
        # After the publish is confirmed, so a failed publish never leaves a Release pointing at a
        # version nobody can install. --generate-notes turns the conventional commits into notes.
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; leaving it alone."
          else
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')"
            gh release create "$TAG" --title "$TAG" --generate-notes ${PREV:+--notes-start-tag "$PREV"}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
