name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Protocol tests
        run: node --test test/protocol.test.ts
      - name: Publish to npm
        # Runs when an NPM_TOKEN secret exists (token with publish rights) or when the
        # repository variable PUBLISH_NPM is "true" (npm trusted publishing / OIDC).
        if: ${{ env.NPM_TOKEN != '' || vars.PUBLISH_NPM == 'true' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
