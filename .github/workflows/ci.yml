name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --no-audit --no-fund
      # `npm test` is the single definition of the unit suite; scripts/gate.sh runs the same list.
      # Do not enumerate files here: that is how the gate drifted to 3 of 6 while the headline
      # kept claiming 80/80.
      - name: Unit tests (no Tern required)
        run: npm test

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (strict, against the real pi and typebox types)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # native/ is plain .mjs, so its types are hand-written; this fails when a declaration
      # names an export the module does not have, in either direction.
      - name: Native declarations match the modules
        run: node scripts/check-native-types.mjs
      # Text-only, and before anything imports lib/bridge-plugin.ts: a bare backtick in the Luau
      # breaks the TypeScript module itself, so a test inside it could never run to report it.
      - name: Generated Luau source is intact
        run: node scripts/check-luau-source.mjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # The artifact, not the repository. Every other job here runs against the checkout, so every
      # other job is silent about the tarball - which is how 1.1.8 shipped five files short, with a
      # `test` script naming ten files and shipping none of them.
      - name: Pack, unpack, install and run the published package
        run: node scripts/check-package.mjs

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # The "never break stock pi" guarantee. This used to run on one laptop only, which is how
      # two RPC checks passed for the wrong reason for three releases: they asserted on
      # substrings the output never contained and used JSON-RPC's {id, method} where pi uses
      # {id, type}. The static tier needs no model call, so it can run here; the model-calling
      # half needs credentials and stays a local `npm run gate` step.
      - name: Compatibility matrix (static tier, no model call)
        run: node native/compat.mjs --static

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Coverage (protocol tests)
        run: node --experimental-strip-types --test --experimental-test-coverage test/protocol.test.ts test/features.test.ts test/refs.test.ts
